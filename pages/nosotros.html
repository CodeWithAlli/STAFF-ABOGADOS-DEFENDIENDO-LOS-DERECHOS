<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestro Equipo | Staff Abogados</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/team-card.css" />

  <style>
    /* ==============================
       Hero del equipo
    ============================== */
    .equipo-hero {
      background: linear-gradient(135deg, #2e0a17, #4e1226);
      padding: 7rem 1rem 4rem;
      text-align: center;
      color: #ffffff;
    }

    .equipo-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 0.75rem;
    }

    .equipo-titulo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    .equipo-sub {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: rgba(255,255,255,0.72);
      max-width: 500px;
      margin: 0 auto 2rem;
      line-height: 1.7;
    }

    @media (max-width: 576px) {
      .equipo-stat-divider { display: none; }
      .equipo-stats        { gap: 1.5rem; }
      .equipo-stat-num     { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div id="navbar-container"></div>

  <main>

    <!-- Hero -->
    <section class="equipo-hero">
      <div class="container">
        <p class="equipo-tag animate__animated animate__fadeInDown">Staff Abogados</p>
        <h1 class="equipo-titulo animate__animated animate__fadeInDown ">
          Las personas detrás<br>de tu defensa
        </h1>
        <p class="equipo-sub animate__animated animate__fadeInUp ">
          Cada abogado del equipo tiene un área específica. Haz clic en el perfil
          que más se acerque a tu caso.
        </p>
      </div>
    </section>

    <!-- Cards inyectadas -->
    <div id="team-container"></div>

  </main>

  <div id="footer-container"></div>

  <div class="social-float">
    <a href="https://facebook.com/staffabogados"          target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
    <a href="https://linkedin.com/company/staffabogados"   target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
    <a href="https://instagram.com/staffabogados"          target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="https://wa.me/51999888777"                    target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
    <a href="https://tiktok.com/@staffabogados"            target="_blank" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/scripts.js"></script>
  <script>
    async function loadComponent(url, targetId) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`No se pudo cargar ${url}`);
        document.getElementById(targetId).innerHTML = await res.text();
      } catch (err) { console.error(err); }
    }

    loadComponent('/components/navbar.html',     'navbar-container');
    loadComponent('/components/footer.html',     'footer-container');
    loadComponent('/components/team-cards.html', 'team-container');
  </script>

</body>
</html>
