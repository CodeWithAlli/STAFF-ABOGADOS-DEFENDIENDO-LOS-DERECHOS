<!-- Componente: Hero Institucional -->
<header class="hero-header">

  <!-- Fondo con overlay -->
  <div class="hero-bg">
    <img src="assets/areas/descarga.jpg" alt="Imagen institucional de Staff Abogados">
  </div>

  <!-- Contenido -->
  <div class="hero-content container text-center d-flex flex-column justify-content-center align-items-center vh-100">

    <p class="hero-tag animate__animated animate__fadeInDown">
      Estudio Jurídico · Lima, Perú · Desde 2006
    </p>

    <h1 class="animate__animated animate__fadeInDown ">
      Defendemos lo que<br>más te importa
    </h1>

    <p class="hero-sub animate__animated animate__fadeInUp ">
      Defensa legal <strong>sólida</strong>, <strong>confidencial</strong>
      y orientada a resultados — más de <strong>15 años</strong>
      protegiendo personas y empresas en el Perú
    </p>

    <!-- Estadísticas rápidas -->
    <div class="hero-stats animate__animated animate__fadeInUp ">
      <div class="hero-stat">
        <span class="hero-stat-number">+500</span>
        <span class="hero-stat-label">Casos resueltos</span>
      </div>
      <div class="hero-stat-divider"></div>
      <div class="hero-stat">
        <span class="hero-stat-number">6</span>
        <span class="hero-stat-label">Especialidades</span>
      </div>
      <div class="hero-stat-divider"></div>
      <div class="hero-stat">
        <span class="hero-stat-number">98%</span>
        <span class="hero-stat-label">Satisfacción</span>
      </div>
    </div>

    <!-- Botones -->
    <div>
      <a href="pages/servicios.html" class="btn btn-hero-primary">
        <i class="fas fa-briefcase me-2"></i> Ver servicios
      </a>
      <a href="pages/contacto.html" class="btn btn-hero-secondary">
        <i class="fas fa-calendar-check me-2"></i> Consulta gratuita
      </a>
    </div>

  </div>

  <!-- Scroll indicator -->
  <a class="scroll-indicator position-absolute bottom-0 mb-4 start-50 translate-middle-x"
    aria-label="Bajar al contenido">
    <i class="fas fa-chevron-down"></i>
  </a>

</header>
